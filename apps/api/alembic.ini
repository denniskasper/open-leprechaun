# Alembic is invoked through pnpm (`pnpm db:migrate`, `pnpm db:revision`), and
# the database URL comes from settings (DATABASE_URL, via .env) inside
# migrations/env.py — it is deliberately absent here so no second copy of it
# exists to drift.

[alembic]
# %(here)s anchors the path to this file, so commands work from any directory.
script_location = %(here)s/migrations

# Date-prefixed filenames keep `ls` in chain order without hand-numbering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
