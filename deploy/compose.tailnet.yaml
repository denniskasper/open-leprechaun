# The deployed instance, as a Dokploy compose stack: reachable over the tailnet
# only. No port is published and no Traefik router exists, so the server's
# public address has no route to it at all — the Tailscale sidecar joins the
# tailnet as a node of its own and serves the application under its MagicDNS
# name, with a certificate Tailscale issues. See docs/deployment.md.
#
# Development never uses this file: compose.yaml at the repository root runs
# Postgres alone and the rest runs on the host (ADR-0002).

x-api: &api
  build:
    context: ..
    target: api
  environment:
    ENVIRONMENT: production
    # The password is part of a URL here, so it must be URL-safe: letters,
    # digits, `-` and `_`.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leprechaun}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leprechaun}
    APPLICATION_SECRET: ${APPLICATION_SECRET:?set APPLICATION_SECRET}
  security_opt:
    - no-new-privileges:true

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-leprechaun}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leprechaun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leprechaun}
    volumes:
      # postgres:18 declares /var/lib/postgresql as its VOLUME; see compose.yaml.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The release step (ADR-0002): migrations run once per deployment, before the
  # API starts, and a migration that fails leaves the API unstarted rather than
  # running against a schema it does not expect.
  migrate:
    <<: *api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    # The sidecar's namespace: the API listens on its loopback and nowhere else,
    # and reaches Postgres through the network the sidecar is attached to.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      target: web
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  tailscale-state:
  postgres-data:
