# One concern: does the whole stack work from the browser's point of view?
# Called by ci.yml; not triggered directly. Needs both toolchains — Playwright
# starts the API and the web dev server itself (see playwright.config.ts).
name: End-to-end tests

on:
  workflow_call:

jobs:
  e2e:
    name: Playwright against the running stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-api

      - uses: ./.github/actions/setup-web

      - name: Install the Playwright browser
        run: pnpm --filter @open-leprechaun/web exec playwright install --with-deps chromium

      # Migrations run as a release step in deployment, so end-to-end tests
      # run against a migrated database — the state a deployed instance is in.
      - name: Migrate
        run: pnpm db:migrate

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
